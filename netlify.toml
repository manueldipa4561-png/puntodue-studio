[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()"
    # Tutto dal nostro dominio; fuori solo Cloudflare Web Analytics (script + invio delle visite).
    # 'unsafe-inline': gli script e gli style="" che Astro mette nelle pagine. blob:/data: servono al modello 3D di INNESTO e alle icone SVG nei CSS.
    # Se si aggiunge un servizio esterno (font, video, mappe, form) va aggiunto qui, altrimenti il browser lo blocca.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Anteprime e immagini KERN: file pesanti che non cambiano spesso. Una settimana, non un anno:
# non hanno l'hash nel nome, quindi se ne sostituisci uno con lo stesso nome i visitatori lo vedono entro 7 giorni
# (per aggiornarlo subito, dagli un nome nuovo).
# ATTENZIONE: mai una regola su un percorso che è anche una pagina (es. "/motion/*" prendeva anche la pagina /motion/,
# che restava in cache 7 giorni e chi l'aveva già aperta non vedeva le modifiche).
[[headers]]
  for = "/previews/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/kern/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# video e modello 3D della demo INNESTO (2 MB): la cartella media/ contiene solo file, nessuna pagina
[[headers]]
  for = "/demo/innesto/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
